name: Magnet to Google Drive

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: "Magnet link"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install qBittorrent
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox curl

      - name: Start qBittorrent
        run: |
          mkdir -p downloads

          qbittorrent-nox \
            --profile="$GITHUB_WORKSPACE/qb-profile" \
            --webui-port=8080 \
            > qb.log 2>&1 &

          echo $! > qb.pid

          sleep 15

          echo "===== qBittorrent ====="
          cat qb.log

      - name: Login to qBittorrent
        run: |
          PASSWORD=$(grep -oP 'temporary password is provided for this session: \K.*' qb.log)

          if [ -z "$PASSWORD" ]; then
            echo "Could not find qBittorrent temporary password."
            exit 1
          fi

          echo "Logging into qBittorrent..."

          LOGIN=$(curl -s \
            -c cookies.txt \
            -H "Referer: http://localhost:8080/" \
            --data-urlencode "username=admin" \
            --data-urlencode "password=$PASSWORD" \
            http://localhost:8080/api/v2/auth/login)

          echo "Login response: $LOGIN"

          if [ "$LOGIN" != "Ok." ]; then
            echo "qBittorrent login failed."
            exit 1
          fi

      - name: Add Magnet
        env:
          MAGNET: ${{ inputs.magnet }}
        run: |
          echo "Adding magnet..."

          RESPONSE=$(curl -s \
            -b cookies.txt \
            -H "Referer: http://localhost:8080/" \
            --data-urlencode "urls=$MAGNET" \
            --data-urlencode "savepath=$GITHUB_WORKSPACE/downloads" \
            http://localhost:8080/api/v2/torrents/add)

          echo "Response: $RESPONSE"

          if [ "$RESPONSE" != "Ok." ]; then
            echo "Failed to add magnet."
            exit 1
          fi

          echo "Magnet added successfully."

      - name: Wait for download
        run: |
          echo "===== DOWNLOAD ====="

          for i in {1..720}; do

            DATA=$(curl -s \
              -b cookies.txt \
              -H "Referer: http://localhost:8080/" \
              "http://localhost:8080/api/v2/torrents/info")

            python3 - "$DATA" <<'PY'
          import sys
          import json

          data = json.loads(sys.argv[1])

          if not data:
              print("Waiting for torrent metadata...")
              sys.exit(0)

          t = data[0]

          progress = t.get("progress", 0) * 100
          speed = t.get("dlspeed", 0) / 1024 / 1024
          eta = t.get("eta", 0)
          state = t.get("state", "unknown")
          peers = t.get("num_peers", 0)
          seeds = t.get("num_seeds", 0)
          downloaded = t.get("downloaded", 0)
          total = t.get("total_size", 0)

          print("--------------------------------")
          print(f"Name: {t.get('name', 'Unknown')}")
          print(f"State: {state}")
          print(f"Progress: {progress:.2f}%")
          print(f"Speed: {speed:.2f} MB/s")
          print(f"Peers: {peers}")
          print(f"Seeds: {seeds}")
          print(f"Downloaded: {downloaded / 1024 / 1024:.2f} MB")
          print(f"Total: {total / 1024 / 1024:.2f} MB")
          print(f"ETA: {eta} sec")
          print("--------------------------------")

          if progress >= 99.99:
              print("DOWNLOAD_COMPLETE")
          PY

            DATA=$(curl -s \
              -b cookies.txt \
              -H "Referer: http://localhost:8080/" \
              "http://localhost:8080/api/v2/torrents/info")

            COMPLETE=$(python3 - "$DATA" <<'PY'
          import sys
          import json

          data = json.loads(sys.argv[1])

          if data and data[0].get("progress", 0) >= 0.9999:
              print("YES")
          else:
              print("NO")
          PY
          )

            if [ "$COMPLETE" = "YES" ]; then
              echo "Download completed successfully."
              break
            fi

            sleep 10
          done

      - name: Verify downloaded files
        run: |
          echo "===== DOWNLOADED FILES ====="

          find downloads \
            -type f \
            -printf "%p %s bytes\n"

          echo
          echo "===== DISK SPACE ====="

          df -h

          echo
          echo "===== FILE COUNT ====="

          find downloads -type f | wc -l

      - name: Install Google Drive libraries
        run: |
          python3 -m pip install \
            --break-system-packages \
            google-api-python-client \
            google-auth \
            google-auth-httplib2

      - name: Upload to Google Drive
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python3 <<'PY'
          import os
          import json
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          print("Connecting to Google Drive...")

          token = json.loads(os.environ["GOOGLE_TOKEN_JSON"])

          credentials = Credentials.from_authorized_user_info(
              token,
              ["https://www.googleapis.com/auth/drive.file"]
          )

          if credentials.expired and credentials.refresh_token:
              print("Refreshing Google access token...")
              credentials.refresh(Request())

          service = build(
              "drive",
              "v3",
              credentials=credentials
          )

          files = [
              p for p in Path("downloads").rglob("*")
              if p.is_file()
          ]

          if not files:
              raise RuntimeError("No downloaded files found.")

          print(f"Found {len(files)} file(s).")

          for path in files:

              size = path.stat().st_size

              print()
              print("================================")
              print(f"Uploading: {path.name}")
              print(f"Size: {size / 1024 / 1024:.2f} MB")
              print("================================")

              metadata = {
                  "name": path.name
              }

              media = MediaFileUpload(
                  str(path),
                  resumable=True,
                  chunksize=100 * 1024 * 1024
              )

              request = service.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,size"
              )

              response = None

              while response is None:

                  status, response = request.next_chunk()

                  if status:
                      progress = status.progress() * 100
                      print(
                          f"Upload progress: {progress:.1f}%"
                      )

              print()
              print("UPLOAD COMPLETE")
              print(f"File ID: {response['id']}")
              print(f"File name: {response['name']}")
              print(f"File size: {response['size']} bytes")

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping qBittorrent..."

          if [ -f qb.pid ]; then
            kill "$(cat qb.pid)" 2>/dev/null || true
          fi

          rm -f cookies.txt

          echo
          echo "===== FINAL DISK ====="
          df -h
