name: Torrent Tracker Test

on:
  workflow_dispatch:

jobs:
  torrent:
    runs-on: ubuntu-latest

    steps:
      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download Ubuntu torrent
        run: |
          wget -q https://releases.ubuntu.com/releases/releases/releases/24.04/ubuntu-24.04.5.1-desktop-amd64.iso.torrent

          mkdir -p downloads

          aria2c \
            --dir="$GITHUB_WORKSPACE/downloads" \
            --file-allocation=none \
            --seed-time=0 \
            --enable-dht=false \
            --enable-peer-exchange=false \
            --bt-tracker-connect-timeout=10 \
            --bt-tracker-interval=30 \
            --bt-max-peers=100 \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --summary-interval=10 \
            --console-log-level=notice \
            --bt-tracker='udp://tracker.opentrackr.org:1337/announce' \
            --bt-tracker='udp://open.stealth.si:80/announce' \
            --bt-tracker='udp://tracker.torrent.eu.org:451/announce' \
            ubuntu-24.04.5.1-desktop-amd64.iso.torrent
