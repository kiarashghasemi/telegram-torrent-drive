name: Torrent Speed Test

on:
  workflow_dispatch:

jobs:
  torrent:
    runs-on: ubuntu-latest

    steps:
      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download Ubuntu torrent
        run: |
          wget -q https://releases.ubuntu.com/releases/releases/releases/24.04/ubuntu-24.04.5.1-desktop-amd64.iso.torrent

          mkdir -p downloads

          aria2c \
            --dir="$GITHUB_WORKSPACE/downloads" \
            --file-allocation=none \
            --seed-time=0 \
            --enable-dht=true \
            --enable-peer-exchange=true \
            --bt-enable-lpd=true \
            --bt-max-peers=500 \
            --bt-request-peer-speed-limit=0 \
            --max-connection-per-server=32 \
            --split=32 \
            --min-split-size=1M \
            --bt-tracker-connect-timeout=10 \
            --bt-tracker-interval=30 \
            --summary-interval=10 \
            --console-log-level=notice \
            ubuntu-24.04.5.1-desktop-amd64.iso.torrent
