name: Network Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Internet
        run: |
          echo "Testing Google..."
          curl -I --max-time 10 https://www.google.com

          echo "Testing GitHub..."
          curl -I --max-time 10 https://github.com

      - name: Test UDP
        run: |
          echo "Testing UDP..."
          timeout 10 bash -c 'echo > /dev/udp/1.1.1.1/6881' \
            && echo "UDP test passed" \
            || echo "UDP test failed"

      - name: Test TCP
        run: |
          echo "Testing TCP..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/1.1.1.1/6881' \
            && echo "TCP test passed" \
            || echo "TCP test failed"
