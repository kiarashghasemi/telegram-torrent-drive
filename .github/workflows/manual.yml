name: qBittorrent Test

on:
  workflow_dispatch:

jobs:
  torrent:
    runs-on: ubuntu-latest

    steps:
      - name: Install qBittorrent
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox

      - name: Download Ubuntu torrent
        run: |
          wget -q https://releases.ubuntu.com/releases/releases/releases/24.04/ubuntu-24.04.5.1-desktop-amd64.iso.torrent

          mkdir -p downloads

          qbittorrent-nox \
            --profile="$GITHUB_WORKSPACE/qb-profile" \
            --configuration="$GITHUB_WORKSPACE/qb-config" \
            --torrenting-port=6881 \
            --webui-port=8080 &
          
          QB_PID=$!

          sleep 10

          echo "qBittorrent started"

          kill $QB_PID || true
