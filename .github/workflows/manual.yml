name: Torrent Test

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: "Magnet link"
        required: true
        type: string

jobs:
  torrent:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download torrent
        env:
          MAGNET: ${{ inputs.magnet }}
        run: |
          mkdir -p downloads

          aria2c \
            --dir="$GITHUB_WORKSPACE/downloads" \
            --file-allocation=none \
            --continue=true \
            --seed-time=0 \
            --summary-interval=10 \
            --console-log-level=notice \
            "$MAGNET"

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          du -sh downloads
          find downloads -type f -printf '%p\n'
